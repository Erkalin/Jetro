<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  body { width: 248px; margin: 0; padding: 12px 14px 14px; font: 13px/1.45 -apple-system, Segoe UI, Roboto, sans-serif; color: #16213a; }
  h1 { font-size: 14px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 20px; height: 20px; }
  p { margin: 6px 0; color: #4a5a75; font-size: 12px; }
  button { width: 100%; margin-top: 8px; padding: 8px 10px; border: 0; border-radius: 8px; background: #1f6feb; color: #fff; font-size: 13px; cursor: pointer; }
  button:hover { background: #1a60cb; }
  label.row { display: flex; align-items: flex-start; gap: 8px; margin-top: 10px; font-size: 12px; color: #16213a; cursor: pointer; }
  label.row input { margin-top: 2px; }
  .hint { font-size: 11px; color: #6b7a90; }
  #status { min-height: 16px; font-size: 12px; color: #1a7f37; margin-top: 8px; }
</style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt="" /> Jetro Resolver</h1>
  <p>Right-click any link, image, video or page and choose <b>Download with Jetro</b>. Jetro opens and resolves the link automatically.</p>
  <button id="sendTab" type="button">Send this page to Jetro</button>
  <label class="row"><input id="intercept" type="checkbox" /> <span>Capture browser downloads<br /><span class="hint">Cancels the built-in download and forwards the URL to Jetro, which resolves it automatically. On by default.</span></span></label>
  <div id="status" role="status"></div>
  <script src="popup.js"></script>
</body>
</html>
